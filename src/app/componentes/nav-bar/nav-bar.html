<ul class="menu menu-horizontal bg-base-200 rounded-box my-2 mx-2">


    @for (route of routes; track route.path){

        <li class="mx-2 font-bold text-lg">
            <a [routerLink]="route.path" 
            routerLinkActive="text-accent">
                {{route.title}}
            </a>
        </li>
    }
</ul>
